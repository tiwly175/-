<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>นับตังค์ — บันทึกรายรับรายจ่าย</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="นับตังค์">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0F1E1B">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%231C3A33'/%3E%3Cstop offset='1' stop-color='%230F1E1B'/%3E%3C/linearGradient%3E%3ClinearGradient id='coin' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23E8B44D'/%3E%3Cstop offset='1' stop-color='%23B5842E'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='180' height='180' fill='url(%23bg)'/%3E%3Ccircle cx='90' cy='90' r='52' fill='url(%23coin)'/%3E%3Ctext x='90' y='112' font-family='Georgia,serif' font-size='64' font-weight='700' fill='%233A2A05' text-anchor='middle'%3E%E0%B8%BF%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='36' fill='%230F1E1B'/%3E%3Ccircle cx='90' cy='90' r='52' fill='%23E8B44D'/%3E%3Ctext x='90' y='112' font-family='Georgia,serif' font-size='64' font-weight='700' fill='%233A2A05' text-anchor='middle'%3E%E0%B8%BF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0F1E1B;
    --surface: #16302B;
    --surface-2: #1C3A33;
    --line: #2A473F;
    --jade: #37C99C;
    --jade-dim: #2A9578;
    --gold: #E8B44D;
    --text: #F2F0E6;
    --text-dim: #9FB3AC;
    --expense: #E2604F;
    --income: #37C99C;
    --transfer: #E8B44D;
    --radius: 18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Sarabun', sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  .app{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100dvh;
    display:flex;
    flex-direction: column;
    position: relative;
    background:
      radial-gradient(700px 300px at 50% -80px, rgba(55,201,156,0.14), transparent 60%),
      var(--bg);
  }
  /* ---------- Top bar ---------- */
  .topbar{
    padding: 18px 20px 8px;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .brand{
    font-family:'Kanit'; font-weight:700; font-size: 19px; letter-spacing:0.2px;
    display:flex; align-items:center; gap:8px;
  }
  .brand .coin{
    width:26px; height:26px; border-radius:50%;
    background: linear-gradient(155deg, var(--gold), #B5842E);
    display:flex; align-items:center; justify-content:center;
    font-family:'Kanit'; font-weight:700; font-size:13px; color:#3A2A05;
    box-shadow: inset 0 -2px 3px rgba(0,0,0,0.25), 0 2px 6px rgba(0,0,0,0.3);
  }
  .month-pill{
    background: var(--surface-2);
    border:1px solid var(--line);
    color: var(--text);
    font-family:'Sarabun'; font-weight:600; font-size:13px;
    padding:7px 12px; border-radius:999px;
    display:flex; align-items:center; gap:6px; flex:0 0 auto;
  }
  .month-pill button{
    background:none; border:none; color:var(--jade); font-size:14px; font-weight:700;
    padding:0 2px; cursor:pointer; line-height:1;
  }

  /* ---------- Account selector row ---------- */
  .acc-row{ display:flex; gap:8px; padding: 6px 20px 4px; overflow-x:auto; scrollbar-width:none; }
  .acc-row::-webkit-scrollbar{display:none;}
  .acc-chip{
    flex:0 0 auto; padding:8px 13px; border-radius:999px; border:1.5px solid var(--line);
    background: var(--surface); color: var(--text-dim); font-size:12.5px; font-weight:600;
    cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:5px;
  }
  .acc-chip.active{ background: var(--jade); border-color: var(--jade); color:#082019; }

  /* ---------- Receipt balance card ---------- */
  .receipt-wrap{ padding: 10px 20px 4px; }
  .receipt{
    position:relative;
    background: linear-gradient(175deg, var(--surface-2), var(--surface));
    border-radius: 4px;
    padding: 22px 22px 18px;
    box-shadow: 0 12px 30px -12px rgba(0,0,0,0.55);
    border:1px solid var(--line);
  }
  .receipt::before, .receipt::after{
    content:"";
    position:absolute; left:0; right:0; height:10px;
    background:
      radial-gradient(circle at 10px 0, transparent 6px, var(--bg) 6.5px) repeat-x;
    background-size: 20px 20px;
  }
  .receipt::before{ top:-9px; transform: rotate(180deg); }
  .receipt::after{ bottom:-9px; }
  .receipt-label{
    font-size:12px; color: var(--text-dim); letter-spacing:0.5px; margin-bottom:4px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .receipt-balance{
    font-family:'JetBrains Mono'; font-weight:700; font-size: 34px; line-height:1.1;
    color: var(--text);
  }
  .receipt-balance .thb{ font-size:16px; color: var(--text-dim); font-weight:600; margin-left:4px;}
  .receipt-divider{
    border:none; border-top: 1.5px dashed var(--line); margin: 16px 0;
  }
  .receipt-rows{ display:flex; gap:14px; }
  .receipt-row{ flex:1; }
  .receipt-row .k{ font-size:11.5px; color:var(--text-dim); display:flex; align-items:center; gap:5px; margin-bottom:3px;}
  .receipt-row .dot{ width:7px; height:7px; border-radius:50%; }
  .receipt-row .v{ font-family:'JetBrains Mono'; font-weight:600; font-size:16px; }
  .v.income{ color: var(--income); }
  .v.expense{ color: var(--expense); }

  /* ---------- Section headers ---------- */
  .section-head{
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px 20px 8px; gap:10px;
  }
  .section-title{ font-family:'Kanit'; font-weight:600; font-size:15px; }
  .section-link{ font-size:12.5px; color: var(--jade); font-weight:600; background:none;border:none; cursor:pointer; white-space:nowrap; }
  .icon-btn{
    background: var(--surface); border:1px solid var(--line); color:var(--text-dim);
    width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-size:14px; cursor:pointer; flex:0 0 auto;
  }
  .icon-btn.active{ background: var(--jade); border-color:var(--jade); color:#082019; }

  .search-row{ padding: 0 20px 8px; }
  .search-row input{
    width:100%; background: var(--surface); border:1.5px solid var(--line); border-radius:12px;
    padding: 10px 13px; color: var(--text); font-family:'Sarabun'; font-size:14px; outline:none;
  }
  .search-row input:focus{ border-color: var(--jade); }

  /* ---------- Chips ---------- */
  .chip-row{ display:flex; gap:8px; padding: 0 20px 4px; overflow-x:auto; scrollbar-width:none; }
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; padding:7px 13px; border-radius:999px; border:1px solid var(--line);
    background: var(--surface); color: var(--text-dim); font-size:12.5px; font-weight:600;
    cursor:pointer; white-space:nowrap;
  }
  .chip.active{ background: var(--jade); border-color: var(--jade); color:#082019; }

  /* ---------- Transaction list ---------- */
  .tx-list{ padding: 6px 20px 110px; display:flex; flex-direction:column; gap:10px; flex:1; }
  .tx-empty{
    text-align:center; color: var(--text-dim); font-size:13.5px; padding: 40px 10px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .tx-empty .big{ font-size:34px; }
  .tx-day-label{ font-size:11.5px; color: var(--text-dim); font-weight:600; margin: 8px 2px 0; }
  .tx-item{
    display:flex; align-items:center; gap:12px;
    background: var(--surface); border:1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; cursor:pointer;
  }
  .tx-icon{
    width:40px; height:40px; border-radius:12px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; font-size:19px;
    background: var(--surface-2);
  }
  .tx-mid{ flex:1; min-width:0; }
  .tx-cat{ font-size:14px; font-weight:600; }
  .tx-note{ font-size:12px; color: var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:1px;}
  .tx-amt{ font-family:'JetBrains Mono'; font-weight:700; font-size:14.5px; flex:0 0 auto; text-align:right; }
  .tx-acc{ font-size:10.5px; color:var(--text-dim); margin-top:1px; }

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position:sticky; bottom:0; left:0; right:0;
    background: rgba(22,48,43,0.92); backdrop-filter: blur(10px);
    border-top:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-around;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    max-width:480px; margin:0 auto; width:100%;
  }
  .navbtn{
    background:none; border:none; color: var(--text-dim); display:flex; flex-direction:column;
    align-items:center; gap:3px; font-size:10.5px; font-weight:600; padding:4px 12px; cursor:pointer;
  }
  .navbtn .ic{ font-size:19px; }
  .navbtn.active{ color: var(--jade); }
  .fab{
    width:52px; height:52px; border-radius:50%; margin-top:-26px;
    background: linear-gradient(155deg, var(--jade), var(--jade-dim));
    color:#06231C; border:none; font-size:26px; font-weight:700;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow: 0 8px 20px -6px rgba(55,201,156,0.6);
  }

  /* ---------- Sheet (modal) ---------- */
  .sheet-backdrop{
    position:fixed; inset:0; background: rgba(6,14,12,0.6);
    display:none; align-items:flex-end; justify-content:center; z-index:50;
  }
  .sheet-backdrop.open{ display:flex; }
  .sheet{
    background: var(--surface); width:100%; max-width:480px;
    border-radius: 22px 22px 0 0; padding: 14px 20px calc(20px + env(safe-area-inset-bottom));
    max-height: 88dvh; overflow-y:auto;
    animation: sheetup 0.22s ease-out;
    border-top:1px solid var(--line);
  }
  @keyframes sheetup{ from{ transform: translateY(24px); opacity:0.4; } to{ transform:none; opacity:1; } }
  .sheet-handle{ width:36px; height:4px; border-radius:2px; background: var(--line); margin: 4px auto 14px; }
  .sheet-title{ font-family:'Kanit'; font-weight:600; font-size:17px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;}
  .sheet-close{ background:none; border:none; color:var(--text-dim); font-size:20px; cursor:pointer; }

  .type-toggle{ display:flex; background: var(--surface-2); border-radius:12px; padding:4px; margin-bottom:16px; }
  .type-toggle button{
    flex:1; border:none; background:none; padding:9px 4px; border-radius:9px; font-weight:600; font-size:12.5px;
    color: var(--text-dim); cursor:pointer;
  }
  .type-toggle button.active.expense{ background: var(--expense); color:#fff; }
  .type-toggle button.active.income{ background: var(--income); color:#06231C; }
  .type-toggle button.active.transfer{ background: var(--transfer); color:#3A2A05; }

  .amt-input-wrap{ text-align:center; margin: 6px 0 18px; }
  .amt-input{
    background:none; border:none; color:var(--text); font-family:'JetBrains Mono'; font-weight:700;
    font-size:38px; text-align:center; width:100%; outline:none;
  }
  .amt-input::placeholder{ color: var(--line); }
  .field-label{ font-size:12px; color: var(--text-dim); font-weight:600; margin: 12px 0 8px; display:flex; justify-content:space-between; align-items:center;}
  .cat-grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap:9px; }
  .cat-btn{
    background: var(--surface-2); border:1.5px solid var(--line); border-radius:14px;
    padding: 10px 4px 8px; display:flex; flex-direction:column; align-items:center; gap:4px;
    cursor:pointer; color: var(--text-dim); font-size:10.5px; font-weight:600;
  }
  .cat-btn .ic{ font-size:19px; }
  .cat-btn.selected{ border-color: var(--jade); color: var(--text); background: rgba(55,201,156,0.12); }
  .cat-btn.add-new{ color: var(--jade); border-style:dashed; }

  .text-field, .date-field, .select-field{
    width:100%; background: var(--surface-2); border:1.5px solid var(--line); border-radius:12px;
    padding: 11px 13px; color: var(--text); font-family:'Sarabun'; font-size:14px; outline:none;
  }
  .text-field:focus, .date-field:focus, .select-field:focus{ border-color: var(--jade); }
  select.select-field{ appearance:none; -webkit-appearance:none; background-image: linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%); background-position: calc(100% - 18px) center, calc(100% - 13px) center; background-size: 5px 5px, 5px 5px; background-repeat:no-repeat; }
  .field-row{ display:flex; gap:10px; }
  .field-row > div{ flex:1; }

  .save-btn{
    width:100%; margin-top:20px; padding: 14px; border:none; border-radius:14px;
    background: var(--jade); color:#06231C; font-family:'Kanit'; font-weight:600; font-size:15px;
    cursor:pointer;
  }
  .delete-btn{
    width:100%; margin-top:10px; padding: 12px; border:1.5px solid var(--expense); border-radius:14px;
    background:none; color: var(--expense); font-weight:600; font-size:13.5px; cursor:pointer;
  }

  /* ---------- Stats view ---------- */
  .stats-wrap{ padding: 4px 20px 110px; }
  .stat-summary{ display:flex; gap:10px; margin: 10px 0 20px; }
  .stat-card{ flex:1; background: var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; }
  .stat-card .k{ font-size:11.5px; color:var(--text-dim); margin-bottom:6px; }
  .stat-card .v{ font-family:'JetBrains Mono'; font-weight:700; font-size:18px; }
  .bar-row{ margin-bottom:14px; }
  .bar-top{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:6px; gap:8px;}
  .bar-top .name{ display:flex; align-items:center; gap:6px; font-weight:600; white-space:nowrap; }
  .bar-top .amt{ font-family:'JetBrains Mono'; color:var(--text-dim); white-space:nowrap; }
  .bar-track{ height:9px; border-radius:5px; background: var(--surface-2); overflow:hidden; }
  .bar-fill{ height:100%; border-radius:5px; background: linear-gradient(90deg, var(--jade), var(--gold)); }
  .bar-fill.over{ background: linear-gradient(90deg, var(--expense), #C4432F); }
  .stats-empty{ text-align:center; color:var(--text-dim); padding:30px 10px; font-size:13.5px; }
  .acc-overview{ display:flex; flex-direction:column; gap:8px; margin-bottom:20px; }
  .acc-ov-item{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:11px 13px;}
  .acc-ov-item .ic{ width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:16px;}
  .acc-ov-item .name{ flex:1; font-size:13.5px; font-weight:600; }
  .acc-ov-item .bal{ font-family:'JetBrains Mono'; font-weight:700; font-size:14px; }

  /* ---------- Settings view ---------- */
  .settings-wrap{ padding: 4px 20px 110px; }
  .set-card{ background: var(--surface); border:1px solid var(--line); border-radius:16px; padding: 4px; margin-bottom:14px; overflow:hidden; }
  .set-row{
    display:flex; align-items:center; gap:12px; padding: 13px 12px; cursor:pointer;
    border-bottom: 1px solid var(--line);
  }
  .set-row:last-child{ border-bottom:none; }
  .set-row .ic{ width:34px; height:34px; border-radius:10px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:16px; }
  .set-row .label{ flex:1; font-size:14px; font-weight:500; }
  .set-row .chev{ color: var(--text-dim); }
  .set-note{ font-size:11.5px; color:var(--text-dim); text-align:center; padding: 6px 10px 0; line-height:1.6; }

  .toast{
    position:fixed; bottom:100px; left:50%; transform: translateX(-50%);
    background: var(--surface-2); border:1px solid var(--line); color:var(--text);
    padding: 10px 18px; border-radius: 999px; font-size:13px; font-weight:600;
    opacity:0; pointer-events:none; transition: opacity 0.25s, transform 0.25s; z-index:60;
    max-width:80%; text-align:center;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(-6px); }

  .view{ display:none; }
  .view.active{ display:block; }
  input[type="date"]{ color-scheme: dark; }

  /* ---------- Instant tap feedback (fixes laggy feel) ---------- */
  .tx-item, .chip, .acc-chip, .cat-btn, .navbtn, .fab, .set-row, .icon-btn,
  .save-btn, .delete-btn, .type-toggle button, .manage-del, .section-link{
    transition: transform 0.07s ease-out, opacity 0.07s ease-out;
    -webkit-user-select:none; user-select:none;
    touch-action: manipulation;
  }
  .tx-item:active, .chip:active, .acc-chip:active, .cat-btn:active, .navbtn:active,
  .fab:active, .set-row:active, .icon-btn:active, .save-btn:active, .delete-btn:active,
  .type-toggle button:active, .manage-del:active, .section-link:active{
    transform: scale(0.96); opacity:0.85;
  }
  .save-btn.is-saving{ opacity:0.6; pointer-events:none; }

  /* ---------- Manage list (accounts/categories/budgets/recurring) ---------- */
  .manage-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:16px; max-height:38vh; overflow-y:auto; }
  .manage-item{ display:flex; align-items:center; gap:10px; background: var(--surface-2); border:1px solid var(--line); border-radius:14px; padding:10px 12px; }
  .manage-item .ic{ font-size:18px; width:30px; text-align:center; flex:0 0 auto;}
  .manage-item .mid{ flex:1; min-width:0; }
  .manage-item .mid .t1{ font-size:13.5px; font-weight:600; }
  .manage-item .mid .t2{ font-size:11.5px; color:var(--text-dim); }
  .manage-item .mval{ font-family:'JetBrains Mono'; font-size:13px; font-weight:600; }
  .manage-item input.budget-input{
    width:88px; background: var(--surface); border:1.5px solid var(--line); border-radius:9px;
    padding:7px 9px; color:var(--text); font-family:'JetBrains Mono'; font-size:13px; text-align:right; outline:none;
  }
  .manage-item input.budget-input:focus{ border-color: var(--jade); }
  .manage-del{ background:none; border:none; color:var(--expense); font-size:16px; cursor:pointer; flex:0 0 auto; padding:2px 4px;}
  .manage-empty{ text-align:center; color:var(--text-dim); font-size:13px; padding:16px 8px; }
  .form-divider{ border:none; border-top:1px dashed var(--line); margin: 18px 0 14px; }

  /* ---------- Calendar ---------- */
  .cal-grid{ display:grid; grid-template-columns: repeat(7, 1fr); gap:5px; margin-top:10px; }
  .cal-head{ text-align:center; font-size:11px; color:var(--text-dim); font-weight:600; padding-bottom:4px; }
  .cal-day{
    aspect-ratio:1; background:var(--surface); border:1.5px solid var(--line); border-radius:10px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer;
    font-size:11px; gap:2px; position:relative;
  }
  .cal-day.today{ border-color: var(--gold); }
  .cal-day.selected{ border-color: var(--jade); background: rgba(55,201,156,0.12); }
  .cal-day .dnum{ font-weight:700; font-size:12px; }
  .cal-day .dsum{ font-family:'JetBrains Mono'; font-size:8.5px; font-weight:600; }
  .cal-day .dsum.income{ color:var(--income); }
  .cal-day .dsum.expense{ color:var(--expense); }
  .cal-empty{ visibility:hidden; }

  /* ---------- Toggle switch ---------- */
  .switch{ width:42px; height:24px; border-radius:999px; background:var(--surface-2); border:1.5px solid var(--line); position:relative; flex:0 0 auto; cursor:pointer; }
  .switch i{ position:absolute; top:2px; left:2px; width:17px; height:17px; border-radius:50%; background:var(--text-dim); transition: transform 0.18s, background 0.18s; }
  .switch.on{ background: var(--jade); border-col
